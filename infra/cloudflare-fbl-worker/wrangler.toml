name = "emailhub-fbl-intake"
main = "src/index.ts"
compatibility_date = "2026-11-01"
account_id = "89ca5206937f2b9dfc01b07ddd1c02c5"
# Email Worker is bound via Email Routing (no HTTP route required).
workers_dev = false
preview_urls = false

# Secrets (per env):
#   npx wrangler secret put FBL_WEBHOOK_SECRET --env dev
#   npx wrangler secret put FBL_WEBHOOK_SECRET --env production
#
# Deploy:
#   npx wrangler deploy --env dev
#   npx wrangler deploy --env production
#
# Email Routing (pick one Worker per address):
#   complaint@fbl.dataaccess1.net      → emailhub-fbl-intake-production  (real FBL)
#   complaint-dev@fbl.dataaccess1.net  → emailhub-fbl-intake-dev         (Dev tests)

[env.dev]
name = "emailhub-fbl-intake-dev"
workers_dev = false
preview_urls = false
vars = { HUB_BASE_URL = "https://emailhub-dev.dataaccess1.net" }

[env.production]
name = "emailhub-fbl-intake-production"
workers_dev = false
preview_urls = false
vars = { HUB_BASE_URL = "https://emailhub.dataaccess1.net" }
