# Server stack (Dev droplet / Prod droplet). SD#13.2 / SD#13.3.
# Only `caddy` publishes host ports. Everything else stays on the internal network.
# Local laptop dependencies remain in docker-compose.dev.yml.
#
# Prod:  docker compose --env-file .env.compose up -d
# Dev:   docker compose -f docker-compose.yml -f docker-compose.dev-server.yml --env-file .env.compose up -d

name: emailhub

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST:?APP_HOST is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      web:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  web:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      NODE_ENV: production
      EMAILHUB_ENV: ${EMAILHUB_ENV:-prod}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:?CLICKHOUSE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-ses}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SES_REGION: ${SES_REGION:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      SES_MAX_SEND_RATE: ${SES_MAX_SEND_RATE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      UNSUBSCRIBE_TOKEN_SECRET: ${UNSUBSCRIBE_TOKEN_SECRET:?UNSUBSCRIBE_TOKEN_SECRET is required}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-}
      OPTIZMO_API_KEY: ${OPTIZMO_API_KEY:-}
      GOOGLE_POSTMASTER_CLIENT_ID: ${GOOGLE_POSTMASTER_CLIENT_ID:-}
      GOOGLE_POSTMASTER_CLIENT_SECRET: ${GOOGLE_POSTMASTER_CLIENT_SECRET:-}
      GOOGLE_POSTMASTER_REFRESH_TOKEN: ${GOOGLE_POSTMASTER_REFRESH_TOKEN:-}
      SNDS_KEY: ${SNDS_KEY:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      BLOCKLISTS: ${BLOCKLISTS:-}
    expose:
      - "3000"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    mem_limit: 1536m
    command: ["node", "apps/worker"]
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      EMAILHUB_ENV: ${EMAILHUB_ENV:-prod}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:?CLICKHOUSE_URL is required}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-ses}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SES_REGION: ${SES_REGION:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      SES_MAX_SEND_RATE: ${SES_MAX_SEND_RATE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      UNSUBSCRIBE_TOKEN_SECRET: ${UNSUBSCRIBE_TOKEN_SECRET:?UNSUBSCRIBE_TOKEN_SECRET is required}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-}
      OPTIZMO_API_KEY: ${OPTIZMO_API_KEY:-}
      GOOGLE_POSTMASTER_CLIENT_ID: ${GOOGLE_POSTMASTER_CLIENT_ID:-}
      GOOGLE_POSTMASTER_CLIENT_SECRET: ${GOOGLE_POSTMASTER_CLIENT_SECRET:-}
      GOOGLE_POSTMASTER_REFRESH_TOKEN: ${GOOGLE_POSTMASTER_REFRESH_TOKEN:-}
      SNDS_KEY: ${SNDS_KEY:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      BLOCKLISTS: ${BLOCKLISTS:-}
    volumes:
      - /data/imports:/data/imports
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  postgres:
    # PG 18 required: schema defaults use native uuidv7() (migration 0004).
    image: postgres:18-bookworm
    restart: unless-stopped
    mem_limit: 3072m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      # Postgres 18+ images expect the volume at /var/lib/postgresql (not .../data).
      - /data/postgres:/var/lib/postgresql
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  clickhouse:
    image: clickhouse:26.8
    restart: unless-stopped
    mem_limit: 6144m
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - /data/clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 768mb
      - --maxmemory-policy
      - noeviction
      - --protected-mode
      - "yes"
      - --bind
      - "0.0.0.0"
    volumes:
      - /data/redis:/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  alloy:
    image: grafana/alloy:v1.10.2
    restart: unless-stopped
    mem_limit: 512m
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./deploy/alloy.config.alloy:/etc/alloy/config.alloy:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
