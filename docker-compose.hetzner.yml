# Side-by-side Hetzner overlay (~8GB ARM): Traefik ingress + sane mem caps.
services:
  caddy:
    mem_limit: 128m
    networks:
      - internal
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.emailhub-hetzner-https.redirectscheme.scheme=https
      - traefik.http.routers.emailhub-hetzner-http.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.emailhub-hetzner-http.entrypoints=http
      - traefik.http.routers.emailhub-hetzner-http.middlewares=emailhub-hetzner-https
      - traefik.http.routers.emailhub-hetzner-https.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.emailhub-hetzner-https.entrypoints=https
      - traefik.http.routers.emailhub-hetzner-https.tls=true
      - traefik.http.routers.emailhub-hetzner-https.tls.certresolver=letsencrypt
      - traefik.http.routers.emailhub-hetzner-https.service=emailhub-hetzner
      - traefik.http.services.emailhub-hetzner.loadbalancer.server.port=80

  web:
    mem_limit: 1024m

  worker:
    mem_limit: 768m

  postgres:
    mem_limit: 1024m

  clickhouse:
    mem_limit: 1536m

  redis:
    mem_limit: 384m
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --protected-mode
      - "yes"
      - --bind
      - "0.0.0.0"

  alloy:
    mem_limit: 128m
    profiles:
      - metrics

networks:
  coolify:
    external: true
