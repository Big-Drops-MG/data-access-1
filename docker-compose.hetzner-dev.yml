# Dev overlay on Hetzner: slim mem + Traefik host + /data/dev volumes + Mailpit via dev-server file.
services:
  caddy:
    mem_limit: 96m
    networks:
      - internal
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.emailhub-hetzner-dev-https.redirectscheme.scheme=https
      - traefik.http.routers.emailhub-hetzner-dev-http.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.emailhub-hetzner-dev-http.entrypoints=http
      - traefik.http.routers.emailhub-hetzner-dev-http.middlewares=emailhub-hetzner-dev-https
      - traefik.http.routers.emailhub-hetzner-dev-https.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.emailhub-hetzner-dev-https.entrypoints=https
      - traefik.http.routers.emailhub-hetzner-dev-https.tls=true
      - traefik.http.routers.emailhub-hetzner-dev-https.tls.certresolver=letsencrypt
      - traefik.http.routers.emailhub-hetzner-dev-https.service=emailhub-hetzner-dev
      - traefik.http.services.emailhub-hetzner-dev.loadbalancer.server.port=80

  web:
    mem_limit: 640m

  worker:
    mem_limit: 384m

  postgres:
    mem_limit: 512m
    volumes:
      - /data/dev/postgres:/var/lib/postgresql

  clickhouse:
    mem_limit: 768m
    volumes:
      - /data/dev/clickhouse:/var/lib/clickhouse

  redis:
    mem_limit: 192m
    volumes:
      - /data/dev/redis:/data
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --protected-mode
      - "yes"
      - --bind
      - "0.0.0.0"

  mailpit:
    mem_limit: 96m

  alloy:
    profiles:
      - metrics

networks:
  coolify:
    external: true
