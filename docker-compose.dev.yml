services:
  postgres:
    # PG 18 required: schema defaults use native uuidv7() (migration 0004).
    image: postgres:18
    environment:
      POSTGRES_USER: emailhub
      POSTGRES_PASSWORD: emailhub
      POSTGRES_DB: emailhub
    ports:
      # Host 5433 avoids clashing with a local Windows/Postgres install on 5432.
      - "5433:5432"
    volumes:
      # Postgres 18+ images expect the volume at /var/lib/postgresql (not .../data).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailhub -d emailhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse:26.8
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: emailhub
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command:
      - redis-server
      - --requirepass
      - emailhub
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "emailhub", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
