# Coolify Terminal ownership labels for Hetzner Prod (EmailHub_App-Prod).
# Used with docker-compose.yml + docker-compose.hetzner.yml when stacks are
# still started outside Coolify Deploy. Coolify-managed deploys inject their
# own labels; keep this file for rollback / hybrid cutover.
services:
  caddy:
    labels:
      - coolify.managed=true
      - coolify.applicationUuid=3pb3hedu9l107fy64pwk0zhd
      - coolify.applicationId=1
      - coolify.type=application
      - coolify.name=caddy
