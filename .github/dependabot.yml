# Weekly dependency updates (SD#14.8).
# Model B: open PRs against `dev` (integration), not `main`.
# Group updates so Dependabot opens a few batched PRs instead of one per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: "dev"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      production-patch-and-minor:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
      development:
        dependency-type: development
      production-major:
        dependency-type: production
        update-types:
          - "major"
    # Keep majors as planned work for high-impact packages; bot handles the rest.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lint-staged"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bullmq"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: "dev"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
