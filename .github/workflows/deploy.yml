# Build → GHCR (amd64+arm64) → migrate → Coolify deploy (SD#13.6 / T-035).
# Dev deploys automatically on push to main.
# Prod waits for GitHub Environment "production" approval.
#
# Coolify on Hetzner listens on 127.0.0.1:8000 only. Deploy jobs SSH to the
# host (deploy/ci-pin-coolify-app-image.sh): plaintext APP_IMAGE in .env.compose
# for coolify-up.sh, PATCH /applications/{uuid}/envs (encrypted in Coolify DB),
# then POST /api/v1/deploy. Never write plaintext into Coolify environment_variables.
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image metadata
        id: meta
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          IMAGE_LOWER="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE_LOWER}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE_LOWER}:${GITHUB_SHA},${IMAGE_LOWER}:main" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (linux/amd64,linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Assert image under 400 MiB (T-025)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE"
          BYTES="$(docker image inspect "$IMAGE" --format '{{.Size}}')"
          MAX="$((400 * 1024 * 1024))"
          echo "Image size (amd64): ${BYTES} bytes (limit ${MAX})"
          test "${BYTES}" -le "${MAX}"

  migrate-dev:
    name: Migrate Dev databases
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Open SSH tunnels to Hetzner Dev Postgres + ClickHouse
        env:
          HETZNER_SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: bash deploy/ci-tunnel-hetzner-dbs.sh emailhub-dev-postgres-1 emailhub-dev-clickhouse-1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write apps/email-hub/.env for migrate
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DEV_DATABASE_MIGRATION_URL }}
          CLICKHOUSE_URL: ${{ secrets.DEV_CLICKHOUSE_URL }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$DATABASE_MIGRATION_URL"
          test -n "$CLICKHOUSE_URL"
          {
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL}"
            echo "CLICKHOUSE_URL=${CLICKHOUSE_URL}"
          } > apps/email-hub/.env

      - name: Run Postgres + ClickHouse migrations
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DEV_DATABASE_MIGRATION_URL }}
          CLICKHOUSE_URL: ${{ secrets.DEV_CLICKHOUSE_URL }}
        run: pnpm --filter @workspace/db db:migrate

  deploy-dev:
    name: Deploy Dev (Coolify)
    needs: [build, migrate-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pin Coolify Dev APP_IMAGE and deploy
        env:
          HETZNER_SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DEV_APP_UUID: ${{ secrets.COOLIFY_DEV_APP_UUID }}
          IMAGE_NAME: ${{ needs.build.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$HETZNER_SSH_HOST"
          test -n "$HETZNER_SSH_USER"
          test -n "$HETZNER_SSH_KEY"
          test -n "$COOLIFY_TOKEN"
          test -n "$COOLIFY_DEV_APP_UUID"
          chmod +x deploy/ci-pin-coolify-app-image.sh
          bash deploy/ci-pin-coolify-app-image.sh \
            "$COOLIFY_DEV_APP_UUID" \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            /opt/emailhub-dev/.env.compose

  migrate-prod:
    name: Migrate Prod databases
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Open SSH tunnels to Hetzner Prod Postgres + ClickHouse
        env:
          HETZNER_SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: bash deploy/ci-tunnel-hetzner-dbs.sh emailhub-postgres-1 emailhub-clickhouse-1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write apps/email-hub/.env for migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.PROD_DATABASE_MIGRATION_URL }}
          CLICKHOUSE_URL: ${{ secrets.PROD_CLICKHOUSE_URL }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$DATABASE_MIGRATION_URL"
          test -n "$CLICKHOUSE_URL"
          {
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL}"
            echo "CLICKHOUSE_URL=${CLICKHOUSE_URL}"
          } > apps/email-hub/.env

      - name: Run Postgres + ClickHouse migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.PROD_DATABASE_MIGRATION_URL }}
          CLICKHOUSE_URL: ${{ secrets.PROD_CLICKHOUSE_URL }}
        run: pnpm --filter @workspace/db db:migrate

  deploy-prod:
    name: Deploy Prod (Coolify)
    needs: [build, migrate-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pin Coolify Prod APP_IMAGE and deploy
        env:
          HETZNER_SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_PROD_APP_UUID: ${{ secrets.COOLIFY_PROD_APP_UUID }}
          IMAGE_NAME: ${{ needs.build.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$HETZNER_SSH_HOST"
          test -n "$HETZNER_SSH_USER"
          test -n "$HETZNER_SSH_KEY"
          test -n "$COOLIFY_TOKEN"
          test -n "$COOLIFY_PROD_APP_UUID"
          chmod +x deploy/ci-pin-coolify-app-image.sh
          bash deploy/ci-pin-coolify-app-image.sh \
            "$COOLIFY_PROD_APP_UUID" \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            /opt/emailhub/.env.compose
