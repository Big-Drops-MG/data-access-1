# Build → GHCR → migrate → Coolify deploy (SD#13.6 / T-035).
# Dev deploys automatically on push to main.
# Prod waits for GitHub Environment "production" approval.
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image metadata
        id: meta
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          IMAGE_LOWER="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE_LOWER}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE_LOWER}:${GITHUB_SHA},${IMAGE_LOWER}:main" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert image under 400 MiB (T-025)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          BYTES="$(docker image inspect "$IMAGE" --format '{{.Size}}')"
          MAX="$((400 * 1024 * 1024))"
          echo "Image size: ${BYTES} bytes (limit ${MAX})"
          test "${BYTES}" -le "${MAX}"

  migrate-dev:
    name: Migrate Dev databases
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write apps/email-hub/.env for migrate
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DEV_DATABASE_MIGRATION_URL }}
          CLICKHOUSE_URL: ${{ secrets.DEV_CLICKHOUSE_URL }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$DATABASE_MIGRATION_URL"
          test -n "$CLICKHOUSE_URL"
          {
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL}"
            echo "CLICKHOUSE_URL=${CLICKHOUSE_URL}"
          } > apps/email-hub/.env

      - name: Run Postgres + ClickHouse migrations
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DEV_DATABASE_MIGRATION_URL }}
          CLICKHOUSE_URL: ${{ secrets.DEV_CLICKHOUSE_URL }}
        run: pnpm --filter @workspace/db db:migrate

  deploy-dev:
    name: Deploy Dev (Coolify)
    needs: [build, migrate-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    steps:
      - name: Pin Coolify Dev image to git SHA and deploy
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DEV_APP_UUID: ${{ secrets.COOLIFY_DEV_APP_UUID }}
          IMAGE_NAME: ${{ needs.build.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          test -n "$COOLIFY_BASE_URL"
          test -n "$COOLIFY_TOKEN"
          test -n "$COOLIFY_DEV_APP_UUID"
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_name\":\"${IMAGE_NAME}\",\"docker_registry_image_tag\":\"${IMAGE_TAG}\"}" \
            "${COOLIFY_BASE_URL%/}/api/v1/applications/${COOLIFY_DEV_APP_UUID}"
          echo
          curl --fail --silent --show-error \
            -X GET \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            "${COOLIFY_BASE_URL%/}/api/v1/deploy?uuid=${COOLIFY_DEV_APP_UUID}&force=true"
          echo
          echo "Requested Dev deploy for ${IMAGE_NAME}:${IMAGE_TAG}"

  migrate-prod:
    name: Migrate Prod databases
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write apps/email-hub/.env for migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.PROD_DATABASE_MIGRATION_URL }}
          CLICKHOUSE_URL: ${{ secrets.PROD_CLICKHOUSE_URL }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$DATABASE_MIGRATION_URL"
          test -n "$CLICKHOUSE_URL"
          {
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL}"
            echo "CLICKHOUSE_URL=${CLICKHOUSE_URL}"
          } > apps/email-hub/.env

      - name: Run Postgres + ClickHouse migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.PROD_DATABASE_MIGRATION_URL }}
          CLICKHOUSE_URL: ${{ secrets.PROD_CLICKHOUSE_URL }}
        run: pnpm --filter @workspace/db db:migrate

  deploy-prod:
    name: Deploy Prod (Coolify)
    needs: [build, migrate-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Pin Coolify Prod image to git SHA and deploy
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_PROD_APP_UUID: ${{ secrets.COOLIFY_PROD_APP_UUID }}
          IMAGE_NAME: ${{ needs.build.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          test -n "$COOLIFY_BASE_URL"
          test -n "$COOLIFY_TOKEN"
          test -n "$COOLIFY_PROD_APP_UUID"
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_name\":\"${IMAGE_NAME}\",\"docker_registry_image_tag\":\"${IMAGE_TAG}\"}" \
            "${COOLIFY_BASE_URL%/}/api/v1/applications/${COOLIFY_PROD_APP_UUID}"
          echo
          curl --fail --silent --show-error \
            -X GET \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            "${COOLIFY_BASE_URL%/}/api/v1/deploy?uuid=${COOLIFY_PROD_APP_UUID}&force=true"
          echo
          echo "Requested Prod deploy for ${IMAGE_NAME}:${IMAGE_TAG}"
