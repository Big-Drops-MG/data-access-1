# Build → GHCR (amd64+arm64) → migrate → Coolify deploy (SD#13.6 / T-035).
# Dev deploys automatically on push to main.
# Prod waits for GitHub Environment "production" approval.
#
# Coolify on Hetzner listens on 127.0.0.1:8000 only. Deploy jobs open an SSH
# tunnel (HETZNER_SSH_*) then call the API at COOLIFY_BASE_URL (usually
# http://127.0.0.1:8000). Compose apps pin APP_IMAGE to the GHCR tag.
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image metadata
        id: meta
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          IMAGE_LOWER="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE_LOWER}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE_LOWER}:${GITHUB_SHA},${IMAGE_LOWER}:main" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (linux/amd64,linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Assert image under 400 MiB (T-025)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE"
          BYTES="$(docker image inspect "$IMAGE" --format '{{.Size}}')"
          MAX="$((400 * 1024 * 1024))"
          echo "Image size (amd64): ${BYTES} bytes (limit ${MAX})"
          test "${BYTES}" -le "${MAX}"

  migrate-dev:
    name: Migrate Dev databases
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write apps/email-hub/.env for migrate
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DEV_DATABASE_MIGRATION_URL }}
          CLICKHOUSE_URL: ${{ secrets.DEV_CLICKHOUSE_URL }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$DATABASE_MIGRATION_URL"
          test -n "$CLICKHOUSE_URL"
          {
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL}"
            echo "CLICKHOUSE_URL=${CLICKHOUSE_URL}"
          } > apps/email-hub/.env

      - name: Run Postgres + ClickHouse migrations
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DEV_DATABASE_MIGRATION_URL }}
          CLICKHOUSE_URL: ${{ secrets.DEV_CLICKHOUSE_URL }}
        run: pnpm --filter @workspace/db db:migrate

  deploy-dev:
    name: Deploy Dev (Coolify)
    needs: [build, migrate-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - name: Open SSH tunnel to Coolify API
        env:
          HETZNER_SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$HETZNER_SSH_HOST"
          test -n "$HETZNER_SSH_USER"
          test -n "$HETZNER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          ssh -fN -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/hetzner_deploy \
            -L 8000:127.0.0.1:8000 \
            "${HETZNER_SSH_USER}@${HETZNER_SSH_HOST}"
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8000/api/v1/version" >/dev/null 2>&1 \
              || curl -fsS -o /dev/null -w '' "http://127.0.0.1:8000/" >/dev/null 2>&1; then
              echo "Coolify tunnel ready"
              exit 0
            fi
            sleep 1
          done
          echo "Coolify tunnel did not become ready" >&2
          exit 1

      - name: Pin Coolify Dev APP_IMAGE and deploy
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DEV_APP_UUID: ${{ secrets.COOLIFY_DEV_APP_UUID }}
          IMAGE_NAME: ${{ needs.build.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_BASE_URL"
          test -n "$COOLIFY_TOKEN"
          test -n "$COOLIFY_DEV_APP_UUID"
          APP_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_name\":\"${IMAGE_NAME}\",\"docker_registry_image_tag\":\"${IMAGE_TAG}\"}" \
            "${COOLIFY_BASE_URL%/}/api/v1/applications/${COOLIFY_DEV_APP_UUID}"
          echo
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"key\":\"APP_IMAGE\",\"value\":\"${APP_IMAGE}\",\"is_literal\":true,\"is_runtime\":true,\"is_buildtime\":true}" \
            "${COOLIFY_BASE_URL%/}/api/v1/applications/${COOLIFY_DEV_APP_UUID}/envs"
          echo
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            "${COOLIFY_BASE_URL%/}/api/v1/deploy?uuid=${COOLIFY_DEV_APP_UUID}&force=true"
          echo
          echo "Requested Dev deploy for ${APP_IMAGE}"

  migrate-prod:
    name: Migrate Prod databases
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write apps/email-hub/.env for migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.PROD_DATABASE_MIGRATION_URL }}
          CLICKHOUSE_URL: ${{ secrets.PROD_CLICKHOUSE_URL }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$DATABASE_MIGRATION_URL"
          test -n "$CLICKHOUSE_URL"
          {
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL}"
            echo "CLICKHOUSE_URL=${CLICKHOUSE_URL}"
          } > apps/email-hub/.env

      - name: Run Postgres + ClickHouse migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.PROD_DATABASE_MIGRATION_URL }}
          CLICKHOUSE_URL: ${{ secrets.PROD_CLICKHOUSE_URL }}
        run: pnpm --filter @workspace/db db:migrate

  deploy-prod:
    name: Deploy Prod (Coolify)
    needs: [build, migrate-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Open SSH tunnel to Coolify API
        env:
          HETZNER_SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$HETZNER_SSH_HOST"
          test -n "$HETZNER_SSH_USER"
          test -n "$HETZNER_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          ssh -fN -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/hetzner_deploy \
            -L 8000:127.0.0.1:8000 \
            "${HETZNER_SSH_USER}@${HETZNER_SSH_HOST}"
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8000/api/v1/version" >/dev/null 2>&1 \
              || curl -fsS -o /dev/null -w '' "http://127.0.0.1:8000/" >/dev/null 2>&1; then
              echo "Coolify tunnel ready"
              exit 0
            fi
            sleep 1
          done
          echo "Coolify tunnel did not become ready" >&2
          exit 1

      - name: Pin Coolify Prod APP_IMAGE and deploy
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_PROD_APP_UUID: ${{ secrets.COOLIFY_PROD_APP_UUID }}
          IMAGE_NAME: ${{ needs.build.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_BASE_URL"
          test -n "$COOLIFY_TOKEN"
          test -n "$COOLIFY_PROD_APP_UUID"
          APP_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_name\":\"${IMAGE_NAME}\",\"docker_registry_image_tag\":\"${IMAGE_TAG}\"}" \
            "${COOLIFY_BASE_URL%/}/api/v1/applications/${COOLIFY_PROD_APP_UUID}"
          echo
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"key\":\"APP_IMAGE\",\"value\":\"${APP_IMAGE}\",\"is_literal\":true,\"is_runtime\":true,\"is_buildtime\":true}" \
            "${COOLIFY_BASE_URL%/}/api/v1/applications/${COOLIFY_PROD_APP_UUID}/envs"
          echo
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            "${COOLIFY_BASE_URL%/}/api/v1/deploy?uuid=${COOLIFY_PROD_APP_UUID}&force=true"
          echo
          echo "Requested Prod deploy for ${APP_IMAGE}"
