# PR checks (SD#13.6 Check stage, SD#16.2 CI services).
# Scoped to packages/files changed vs the PR base when possible.
name: PR

on:
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://emailhub_app:emailhub@localhost:5432/emailhub
  DATABASE_MIGRATION_URL: postgresql://emailhub:emailhub@localhost:5432/emailhub
  CLICKHOUSE_URL: http://localhost:8123
  # CI Redis has no auth (GHA service containers cannot set requirepass like Compose).
  REDIS_URL: redis://localhost:6379
  MAIL_TRANSPORT: smtp
  SMTP_HOST: localhost
  SMTP_PORT: "1025"

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # PG 18 required for native uuidv7() used by packages/db migrations.
        image: postgres:18
        env:
          POSTGRES_USER: emailhub
          POSTGRES_PASSWORD: emailhub
          POSTGRES_DB: emailhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emailhub -d emailhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      clickhouse:
        image: clickhouse:26.8
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://localhost:8123/ping | grep -q Ok"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mailpit:
        image: axllent/mailpit:v1.27.10
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need the PR base commit for turbo/vitest change filters.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "pnpm install failed after ${max_attempts} attempts"
              exit 1
            fi
            sleep_seconds=$((attempt * 20))
            echo "pnpm install failed (attempt ${attempt}/${max_attempts}); retrying in ${sleep_seconds}s"
            rm -rf node_modules
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Resolve change scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/pr-change-scope.sh
          .github/scripts/pr-change-scope.sh "${{ github.event.pull_request.base.sha }}"

      - name: ESLint, typecheck, build (affected)
        if: steps.scope.outputs.run_turbo == 'true'
        run: |
          set -euo pipefail
          FILTER="${{ steps.scope.outputs.turbo_filter }}"
          if [ -z "$FILTER" ]; then
            echo "turbo filter: <all packages>"
            pnpm exec turbo run lint typecheck build
          else
            echo "turbo filter: ${FILTER}"
            pnpm exec turbo run lint typecheck build --filter="${FILTER}"
          fi

      - name: Prettier check (changed files)
        if: steps.scope.outputs.run_prettier == 'true'
        run: |
          set -euo pipefail
          list_file="${{ steps.scope.outputs.prettier_list_file }}"
          mapfile -t files < <(sed '/^$/d' "$list_file")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No prettier-eligible files changed"
            exit 0
          fi
          echo "Checking ${#files[@]} file(s)"
          pnpm exec prettier --check -- "${files[@]}"

      # Package exports resolve to dist/. Always build before Vitest so scoped
      # runs cannot skip workspace package outputs.
      - name: Build workspace packages for Vitest
        if: steps.scope.outputs.run_unit == 'true' || steps.scope.outputs.run_coverage == 'true'
        run: |
          set -euo pipefail
          FILTER="${{ steps.scope.outputs.turbo_filter }}"
          if [ -z "$FILTER" ]; then
            pnpm exec turbo run build
          else
            pnpm exec turbo run build --filter="${FILTER}"
          fi

      - name: Vitest (changed)
        if: steps.scope.outputs.run_unit == 'true'
        run: |
          set -euo pipefail
          pnpm exec vitest run --changed "${{ steps.scope.outputs.base_sha }}" --passWithNoTests

      - name: Vitest coverage
        if: steps.scope.outputs.run_coverage == 'true'
        run: pnpm test:coverage

      - name: Database role, seed, and factories
        if: steps.scope.outputs.run_db_int == 'true'
        run: pnpm exec vitest run --config vitest.int.config.ts packages/db/src/app-role.int.test.ts packages/db/src/dev-seed.int.test.ts packages/db/test/factories.int.test.ts packages/db/test/test-database.int.test.ts

      - name: Per-worker test databases
        if: steps.scope.outputs.run_workers_int == 'true'
        run: pnpm test:int:workers

      - name: Nothing to check
        if: |
          steps.scope.outputs.run_turbo != 'true' &&
          steps.scope.outputs.run_prettier != 'true' &&
          steps.scope.outputs.run_unit != 'true' &&
          steps.scope.outputs.run_coverage != 'true' &&
          steps.scope.outputs.run_db_int != 'true' &&
          steps.scope.outputs.run_workers_int != 'true'
        run: echo "No lint/test/build scope for this change set"
