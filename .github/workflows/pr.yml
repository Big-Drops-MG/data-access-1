# PR checks (SD#13.6 Check stage, SD#16.2 CI services).
name: PR

on:
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://emailhub_app:emailhub@localhost:5432/emailhub
  DATABASE_MIGRATION_URL: postgresql://emailhub:emailhub@localhost:5432/emailhub
  CLICKHOUSE_URL: http://localhost:8123
  # CI Redis has no auth (GHA service containers cannot set requirepass like Compose).
  REDIS_URL: redis://localhost:6379
  MAIL_TRANSPORT: smtp
  SMTP_HOST: localhost
  SMTP_PORT: "1025"

jobs:
  quality:
    name: Lint, format, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "pnpm install failed after ${max_attempts} attempts"
              exit 1
            fi
            sleep_seconds=$((attempt * 20))
            echo "pnpm install failed (attempt ${attempt}/${max_attempts}); retrying in ${sleep_seconds}s"
            rm -rf node_modules
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Lint, Prettier, Typecheck
        run: |
          set -euo pipefail
          pnpm lint &
          pid_lint=$!
          pnpm format:check &
          pid_fmt=$!
          pnpm typecheck &
          pid_tc=$!
          status=0
          wait "$pid_lint" || status=1
          wait "$pid_fmt" || status=1
          wait "$pid_tc" || status=1
          exit "$status"

      - name: Build
        run: pnpm build

  test:
    name: Test, coverage, integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # PG 18 required for native uuidv7() used by packages/db migrations.
        image: postgres:18
        env:
          POSTGRES_USER: emailhub
          POSTGRES_PASSWORD: emailhub
          POSTGRES_DB: emailhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emailhub -d emailhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      clickhouse:
        image: clickhouse:26.8
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://localhost:8123/ping | grep -q Ok"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mailpit:
        image: axllent/mailpit:v1.27.10
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "pnpm install failed after ${max_attempts} attempts"
              exit 1
            fi
            sleep_seconds=$((attempt * 20))
            echo "pnpm install failed (attempt ${attempt}/${max_attempts}); retrying in ${sleep_seconds}s"
            rm -rf node_modules
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      # Coverage runs the full unit suite once and enforces thresholds (SD#16.5).
      # Do not also run `pnpm test` — that duplicated ~3 minutes of the same work.
      - name: Vitest coverage
        run: pnpm test:coverage

      - name: Database role, seed, and factories
        run: pnpm exec vitest run --config vitest.int.config.ts packages/db/src/app-role.int.test.ts packages/db/src/dev-seed.int.test.ts packages/db/test/factories.int.test.ts packages/db/test/test-database.int.test.ts

      - name: Per-worker test databases
        run: pnpm test:int:workers

  # Keeps a stable required-check name for branch protection.
  check:
    name: Lint, typecheck, test, build
    needs:
      - quality
      - test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require quality and test jobs
        run: |
          set -euo pipefail
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
